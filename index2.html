<!DOCTYPE html>
<html lang="ja">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好きなもの紹介</title>
    <link href="styles/style.css" rel="stylesheet" />  <!--linkタグなどで指定するCSSファイルの置き場所を指定。今回は現在開いているhtmlファイルのstyle.cssを読み込む-->
    <script src="scripts/script.js" defer></script> 

    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" />  <!--フォント指定。relで読み込むファイルがCSSなのを指定-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Opti&display=swap" rel="stylesheet">
 </head>


 <body>
   <!-- <p> &lt;p&gt;で段落を指定 </p> 内改行は<br> -->
   <!-- Ctrol+/でコメント行（非表示） -->
   <!-- <img src="images/" alt="" class=""/>　<img src="ソース。パスをコピペ。imagesフォルダー内に入れたらimages/画像の名前を貼る。" alt="画像のALTを書く" /> -->
   <!-- リンクは安全なサイト先に限定し、<a href="リンク" target="_blank" rel="noopener">リンク名</a>　　target:どの窓で開くか，rel=noopener:元の窓に干渉しないようにする-->

  <header class="site-header container">
    <div class="kaisei-opti-regular" style="font-size: 30px;">好きなもの紹介</div>
  <!-- ヘッダーエリア（背景色 #f7f4ec を指定する場所） -->
    <div class="hamburger-menu">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <nav class="nav-menu">
      <a href="index.html">メインページ</a>
      <a href="index2.html">𝕏アカウント <br>お問い合わせ</a>
      <a href="#">Menu 3</a>
    </nav>
  </header>

<!-- ↓ ヘッダー以下の本文全体を <main> で囲む -->
<main class="main-content">

  <h1 class="button_line001"  style="margin-top: 0;"> <a href="https://x.com/html_practicer" target="_blank" rel="noopener" style="text-decoration: none">𝕏アカウント</a> </h1>
  <br><img src="images/pracrticer.png" alt="Webページ作者のXアカウントの画像" style="width: 90%; height: auto;">
  <div class="twitter-wrapper">
  <a class="twitter-timeline" data-width="100%" data-height="600" href="https://x.com/html_practicer?ref_src=twsrc%5Etfw">Tweets by html_practicer</a>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  </div>

  <h1 class="button_line001" style="margin-top: 0;"> <a target="_blank" rel="noopener" style="text-decoration: none">お問い合わせフォーム</a> </h1>
  <br><div class="contact-form-container">
    <form id="contactForm" action="#" method="post" novalidate>
      <!-- ご用件（必須） -->
      <div class="form-group">
        <div class="form-label">
          ご用件 <span class="badge-required">必須</span>
        </div>
        <div class="form-input">
          <select name="subject" id="subject">
            <option value="" disabled selected>選択してください</option>
            <option value="inquiry">お問い合わせ</option>
            <option value="request">資料請求</option>
            <option value="other">その他</option>
          </select>
          <span class="error-message" id="subjectError">ご用件を選択してください。</span>
        </div>
      </div>

      <!-- お名前 -->
      <div class="form-group">
        <div class="form-label">お名前</div>
        <div class="form-input">
          <input type="text" name="fullname" id="fullname">
        </div>
      </div>

      <!-- 電話番号（半角） -->
      <div class="form-group">
        <div class="form-label">電話番号（半角）</div>
        <div class="form-input">
          <input type="tel" name="tel" id="tel" placeholder="例: 09012345678">
          <span class="error-message" id="telError">半角数字（ハイフン可）で入力してください。</span>
        </div>
      </div>

      <!-- Mail（半角） -->
      <div class="form-group">
        <div class="form-label">Mail（半角）</div>
        <div class="form-input">
          <input type="email" name="email" id="email" placeholder="例: example@example.com">
          <span class="error-message" id="emailError">正しいメールアドレスの形式で入力してください。</span>
        </div>
      </div>

      <!-- お問い合わせ内容（必須） -->
      <div class="form-group align-start">
        <div class="form-label pt-8">
          お問い合わせ内容 <span class="badge-required">必須</span>
        </div>
        <div class="form-input">
          <textarea name="message" id="message"></textarea>
          <span class="error-message" id="messageError">お問い合わせ内容を入力してください。</span>
        </div>
      </div>

      <!-- プライバシーポリシー本文 -->
      <div class="privacy-box">
        <h4>プライバシー</h4>
        <p>保留　多分機能してないです</p>
      </div>

      <!-- プライバシー同意 -->
      <div class="privacy-agree">
        <label>
          <input type="checkbox" name="agree" id="agree"> プライバシーポリシーに同意する
        </label>
        <div>
          <span class="error-message text-center" id="agreeError">プライバシーポリシーへの同意が必要です。</span>
        </div>
      </div>

      <!-- 送信ボタン -->
      <div class="submit-btn-wrapper">
        <button type="submit" class="submit-btn">確認</button>
      </div>

    </form>
  </div>

</main>

</body>
</html>
